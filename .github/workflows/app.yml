# The athlete's app: tests, the web version on GitHub Pages, and the builds for Google Play and the App Store.
# What each job does, which secrets it needs and what has not been tried yet: docs/app/butikerna/butikerna.md.
name: App

on:
  workflow_dispatch:
    inputs:
      skarmbilder:
        description: "Ta skärmbilderna till butikerna"
        type: boolean
        default: false
      ladda_upp:
        description: "Ladda upp till TestFlight och Play (internt test), om nycklarna finns"
        type: boolean
        default: false
  push:
    tags: ["app-v*"]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

defaults:
  run:
    working-directory: app

jobs:
  web:
    name: Webb (prov och bygge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Prov (Vitest)
        run: npx vitest run

      - name: Versionen
        id: version
        # A tag app-v1.2.3 gives 1.2.3; otherwise the version in package.json.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then v="${GITHUB_REF#refs/tags/app-v}"; else v="$(node -p 'require("./package.json").version')"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: Bygge för GitHub Pages (/troskel/app/)
        env:
          TROSKEL_BASE: /troskel/app/
        run: npx vite build --outDir dist-pages

      - name: Bygge för appbutikerna (relativ bas)
        env:
          TROSKEL_BASE: ./
        run: npx vite build --outDir dist

      - name: Webbplatsen
        # The site root (/troskel/) sends the visitor on to the app; the app and its privacy page live under /troskel/app/.
        run: |
          mkdir -p ../_site
          cp -r dist-pages ../_site/app
          cat > ../_site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Tröskel</title>
          <meta http-equiv="refresh" content="0; url=app/"><a href="app/">Tröskel</a>
          HTML

      - uses: actions/upload-artifact@v4
        with:
          name: web-native
          path: app/dist
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  pages:
    name: Publicera på GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}app/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android (APK och AAB)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Gradle project includes @capacitor/android from node_modules.
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-native
          path: app/dist

      - run: npx cap sync android

      - name: Uppladdningsnyckeln
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "TROSKEL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle
        working-directory: app/android
        env:
          TROSKEL_VERSION_CODE: ${{ github.run_number }}
          TROSKEL_VERSION_NAME: ${{ needs.web.outputs.version }}
          TROSKEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TROSKEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TROSKEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleDebug bundleRelease
          if [ "$HAS_KEY" != "true" ]; then echo "::notice::Ingen uppladdningsnyckel: AAB-filen är osignerad och kan inte laddas upp till Play."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.web.outputs.version }}-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Till Play (internt test, som utkast)
        # Play's API accepts a bundle only after the first one has been uploaded by hand in Play Console.
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true' && (startsWith(github.ref, 'refs/tags/app-v') || inputs.ladda_upp)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.generaltgul.troskel
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    name: iOS (simulatorn, utan signering)
    needs: web
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-native
          path: app/dist

      - run: npx cap sync ios

      - name: xcodebuild för simulatorn
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit "${PIPESTATUS[0]}"

  ios-release:
    name: iOS till TestFlight
    # Runs only on a tag or when asked, and the first step stops quietly when the App Store Connect key is missing.
    if: startsWith(github.ref, 'refs/tags/app-v') || inputs.ladda_upp
    needs: [web, ios]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Finns nyckeln?
        working-directory: .
        run: |
          if [ "$HAS_ASC" != "true" ]; then echo "::notice::Ingen App Store Connect-nyckel (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID): inget iOS-bygge till TestFlight."; fi

      - uses: actions/checkout@v4
        if: env.HAS_ASC == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_ASC == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: env.HAS_ASC == 'true'
        run: npm ci

      - uses: actions/download-artifact@v4
        if: env.HAS_ASC == 'true'
        with:
          name: web-native
          path: app/dist

      - if: env.HAS_ASC == 'true'
        run: npx cap sync ios

      - name: App Store Connect-nyckeln
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Arkiv, signerat automatiskt med nyckeln
        # Cloud-managed signing: Xcode makes the distribution certificate and the profile with the API key,
        # so no certificate or profile is stored as a secret. The key needs the Admin role for that.
        if: env.HAS_ASC == 'true'
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Troskel.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ needs.web.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60
          exit "${PIPESTATUS[0]}"

      - name: Uppladdning till App Store Connect (TestFlight)
        if: env.HAS_ASC == 'true'
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Troskel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Ta bort nyckeln
        if: always() && env.HAS_ASC == 'true'
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/asc"

  screenshots:
    name: Skärmbilder till butikerna
    if: inputs.skarmbilder
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Playwright (bara för skärmbilderna)
        run: |
          npm i --no-save playwright@1.65.1
          npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: web-native
          path: app/dist

      - name: Skärmbilderna
        env:
          TROSKEL_BASE: ./
        run: node store/screenshots.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: skarmbilder-${{ needs.web.outputs.version }}
          path: app/store/screenshots
          retention-days: 30
